<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Item DB - 商品＆価格管理データベース</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts & FontAwesome -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Leaflet CSS & JS (店舗マップ用) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- JAN Master Proと同系統のQuagga2スキャナ -->
  <script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2/dist/quagga.min.js"></script>

  <!-- Firebase v10 Compat -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    body { font-family: 'Inter', sans-serif; }
    .nav-active { color: #2563eb; border-bottom: 2px solid #2563eb; }
    #reader { position: relative; width: 100%; height: 300px; background: #0f172a; overflow: hidden; border-radius: .75rem; }
    #reader video { display:block; width:100% !important; height:100% !important; object-fit:cover; }
    #reader canvas.drawingBuffer { position:absolute; inset:0; width:100% !important; height:100% !important; }
    #reader::after { content:''; position:absolute; left:8%; right:8%; top:34%; height:32%; border:2px solid rgba(52,211,153,.95); border-radius:8px; box-shadow:0 0 0 999px rgba(15,23,42,.22); pointer-events:none; z-index:4; }
    #reader::before { content:'JANバーコードを緑の枠に合わせる'; position:absolute; z-index:5; left:0; right:0; top:calc(34% - 26px); color:white; text-align:center; font-size:11px; text-shadow:0 1px 3px #000; pointer-events:none; }
    input, textarea, button { -webkit-tap-highlight-color: transparent; }
    .compact-panel { padding: .75rem !important; border-radius: .8rem !important; }
    @media (max-width: 640px) { #reader { height: 260px; } }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

  <!-- ヘッダー -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
    <div class="max-w-6xl mx-auto px-3 py-2.5 flex justify-between items-center">
      <div class="flex items-center space-x-2.5">
        <div class="bg-blue-600 text-white p-2 rounded-xl text-lg font-bold shadow-sm">
          <i class="fa-solid fa-barcode"></i>
        </div>
        <div>
          <h1 class="text-base font-bold leading-tight text-slate-900">Smart Item DB</h1>
          <p class="text-[11px] text-slate-500">店舗＆EC価格管理 <span id="storageStatus" class="text-emerald-600">· アカウント保存</span></p>
        </div>
      </div>

      <!-- ログイン状況・ユーザーエリア -->
      <div id="userInfoArea" class="flex items-center space-x-3">
        <!-- JS動的描画 -->
      </div>
    </div>

    <!-- ナビゲーションタブ -->
    <nav class="max-w-6xl mx-auto px-4 flex space-x-6 text-sm font-medium border-t border-slate-100 overflow-x-auto">
      <button onclick="switchTab('items')" id="tab-items" class="py-2.5 nav-active whitespace-nowrap">
        <i class="fa-solid fa-boxes-stacked mr-1.5"></i>商品・価格一覧
      </button>
      <button onclick="switchTab('map')" id="tab-map" class="py-2.5 text-slate-600 hover:text-blue-600 whitespace-nowrap">
        <i class="fa-solid fa-map-location-dot mr-1.5"></i>店舗マップ
      </button>
    </nav>
  </header>

  <!-- メインコンテンツ -->
  <main class="flex-1 max-w-6xl w-full mx-auto p-3 sm:p-4 space-y-3">

    <!-- TAB 1: 商品一覧＆データベース -->
    <section id="view-items" class="space-y-4">
      
      <!-- DB切り替え & アクションバー -->
      <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm flex flex-col md:flex-row gap-3 items-stretch md:items-center justify-between">
        <!-- 個人 / オープン DB切り替え -->
        <div class="flex bg-slate-100 p-1 rounded-lg self-start">
          <button id="dbTypePersonal" onclick="setDbType('personal')" class="px-4 py-1.5 text-xs font-semibold rounded-md bg-white text-blue-600 shadow-sm transition">
            <i class="fa-solid fa-user mr-1"></i>個人 DB
          </button>
          <button id="dbTypeOpen" onclick="setDbType('open')" class="px-4 py-1.5 text-xs font-semibold rounded-md text-slate-600 hover:text-slate-900 transition">
            <i class="fa-solid fa-earth-americas mr-1"></i>オープン DB (公開)
          </button>
        </div>

        <!-- 各種アクションボタン -->
        <div class="flex flex-wrap gap-2">
          <button onclick="openScanModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-3.5 py-2 rounded-lg text-xs font-medium flex items-center shadow-sm transition">
            <i class="fa-solid fa-camera mr-1.5"></i>JANスキャン
          </button>
          <button onclick="openItemModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3.5 py-2 rounded-lg text-xs font-medium flex items-center shadow-sm transition">
            <i class="fa-solid fa-plus mr-1.5"></i>商品登録
          </button>
          <button onclick="triggerMerge()" class="bg-slate-800 hover:bg-slate-900 text-white px-3.5 py-2 rounded-lg text-xs font-medium flex items-center shadow-sm transition" title="オープンDBと個人DBをマージします">
            <i class="fa-solid fa-code-merge mr-1.5"></i>DBマージ
          </button>
        </div>
      </div>

      <!-- 検索・フィルターバー -->
      <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm space-y-3">
        <div class="relative">
          <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-400 text-sm"></i>
          <input type="text" id="searchInput" oninput="filterItems()" placeholder="商品名、JANコード、店舗名で検索..." class="w-full pl-10 pr-20 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs md:text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          <button type="button" id="clearSearchButton" onclick="clearSearchInput()" title="検索内容を消去" aria-label="検索内容を消去" class="hidden absolute right-10 top-1/2 -translate-y-1/2 rounded-md px-2 py-1 text-slate-500 hover:bg-slate-100"><i class="fa-solid fa-xmark"></i></button>
          <button type="button" onclick="openSearchScanModal()" title="カメラでJAN検索" aria-label="カメラでJAN検索" class="absolute right-2 top-1/2 -translate-y-1/2 rounded-md px-2 py-1 text-blue-600 hover:bg-blue-50"><i class="fa-solid fa-camera"></i></button>
        </div>
        <!-- タグは一覧に並べず、登録時の入力候補としてのみ表示 -->
        <div id="tagContainer" class="hidden"></div>
      </div>

      <!-- 商品グリッドカード -->
      <div id="itemList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <!-- JS動的描画 -->
      </div>
    </section>

    <!-- TAB 2: 店舗マップ -->
    <section id="view-map" class="hidden space-y-3">
      <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm space-y-2">
        <div class="flex items-center justify-between gap-2">
          <div><h2 class="font-bold text-slate-800 text-sm">店舗マップ</h2><p class="text-[11px] text-slate-500">登録済みの購入店舗と位置情報を確認</p></div>
          <button onclick="locateUser()" class="shrink-0 bg-blue-600 hover:bg-blue-700 text-white text-xs px-3 py-2 rounded-lg"><i class="fa-solid fa-location-crosshairs mr-1"></i>現在地</button>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div class="rounded-lg bg-slate-50 p-2"><p class="text-[10px] text-slate-500">登録店舗記録</p><p id="mapStoreCount" class="text-lg font-bold text-slate-800">0</p></div>
          <div class="rounded-lg bg-slate-50 p-2"><p class="text-[10px] text-slate-500">地図表示できる位置</p><p id="mapPinCount" class="text-lg font-bold text-blue-700">0</p></div>
        </div>
      </div>
      <div class="relative"><div id="map" class="w-full h-[55vh] min-h-[320px] max-h-[620px] rounded-xl border border-slate-200 shadow-sm overflow-hidden"></div><button onclick="fitStoreMap()" class="absolute right-3 top-3 z-[500] bg-white/95 border border-slate-300 shadow rounded-lg px-3 py-2 text-xs font-semibold"><i class="fa-solid fa-expand mr-1"></i>店舗全体を表示</button></div>
      <div class="bg-white rounded-xl border border-slate-200 p-3 space-y-2"><div class="flex items-center justify-between"><h3 class="font-bold text-sm">登録店舗一覧</h3><span class="text-[10px] text-slate-400">位置情報がある店舗は地図に表示</span></div><div id="mapStoreList" class="space-y-1"><p class="text-xs text-slate-500">店舗データを読み込み中…</p></div></div>
    </section>


  </main>

  <!-- Modal: JANコードスキャナー -->
  <div id="scanModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-5 space-y-4 shadow-xl">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-bold text-slate-800 text-sm"><i class="fa-solid fa-camera mr-2 text-blue-600"></i>JANバーコードスキャン</h3>
        <button onclick="closeScanModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <div id="reader"></div>
      <div id="scanStatus" class="text-center text-[11px] text-slate-500">カメラ起動準備中…</div>
      <div class="flex gap-2"><button type="button" onclick="restartScanCamera()" class="flex-1 rounded-lg bg-blue-600 text-white py-2 text-xs font-semibold"><i class="fa-solid fa-camera-rotate mr-1"></i>再読み込み</button><button type="button" onclick="closeScanModal()" class="rounded-lg border border-slate-300 px-4 py-2 text-xs">閉じる</button></div>
    </div>
  </div>

  <!-- Modal: 商品登録 / 編集 -->
  <div id="itemModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 overflow-y-auto">
    <div class="bg-white rounded-2xl max-w-lg w-full p-3 sm:p-4 space-y-2 shadow-xl my-3 text-xs md:text-sm max-h-[92vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 id="modalTitle" class="font-bold text-slate-900 text-base">商品を新規登録</h3>
        <button onclick="closeItemModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>

      <form id="itemForm" onsubmit="handleSaveItem(event)" class="space-y-2">
        <input type="hidden" id="editItemId">

        <div class="grid grid-cols-2 gap-x-2 gap-y-1.5">
          <div><label class="block text-[11px] font-medium text-slate-600 mb-0.5">メーカー名</label><input type="text" id="formMaker" class="w-full p-2 border border-slate-300 rounded-lg" placeholder="例：サントリー"></div>
          <div><label class="block text-[11px] font-medium text-slate-600 mb-0.5">商品名 <span class="text-red-500">*</span></label><input type="text" id="formName" required class="w-full p-2 border border-slate-300 rounded-lg" placeholder="例：天然水"></div>
          <div><label class="block text-[11px] font-medium text-slate-600 mb-0.5">フレーバー・種類など</label><input type="text" id="formFlavor" class="w-full p-2 border border-slate-300 rounded-lg" placeholder="例：レモン、無糖"></div>
          <div><label class="block text-[11px] font-medium text-slate-600 mb-0.5">内容量</label><input type="text" id="formContent" class="w-full p-2 border border-slate-300 rounded-lg" placeholder="例：500ml、6本"></div>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-[11px] font-medium text-slate-600 mb-0.5">JANコード</label>
            <div class="flex gap-1"><input type="text" id="formJan" class="min-w-0 flex-1 p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="4900000000000"><button type="button" onclick="openJanFieldScanModal()" title="カメラでJANを読み取る" aria-label="カメラでJANを読み取る" class="shrink-0 px-3 rounded-lg bg-blue-50 border border-blue-200 text-blue-700"><i class="fa-solid fa-camera"></i></button></div>
          <div class="col-span-2">
            <label class="block text-[11px] font-medium text-slate-600 mb-0.5">商品区分（消費税・商品ごとに設定）</label>
            <select id="formTaxType" class="w-full p-2 border border-slate-300 rounded-lg bg-white"><option value="food">食品（8%）</option><option value="other">食品以外（10%）</option></select>
          </div>
          </div>
          <div>
            <label class="block text-[11px] font-medium text-slate-600 mb-0.5">タグ（「,」または「、」で区切り）</label>
            <input type="text" id="formTags" autocomplete="off" oninput="renderTagSuggestions()" class="w-full p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="飲料、特売">
            <div id="tagSuggestions" class="flex flex-wrap gap-1 mt-1"></div>
          </div>
        </div>

        <div class="bg-slate-50 p-2.5 rounded-lg border border-slate-200 space-y-1.5">
          <p class="font-bold text-xs text-slate-700"><i class="fa-solid fa-store mr-1 text-blue-600"></i>店舗・日付・価格の記録</p>
          <div class="grid grid-cols-2 gap-2">
            <div><label class="block text-[10px] text-slate-500 mb-1">店舗名</label><input type="text" id="formStore" placeholder="例：イオン" class="w-full p-2 border border-slate-300 rounded-lg bg-white text-xs"></div>
            <div><label class="block text-[10px] text-slate-500 mb-1">支店・店舗名</label><input type="text" id="formBranch" placeholder="例：名古屋駅前店" class="w-full p-2 border border-slate-300 rounded-lg bg-white text-xs"></div>
            <div><label class="block text-[10px] text-slate-500 mb-1">価格（税抜・円）</label><input type="number" id="formPrice" min="0" step="1" placeholder="税抜価格" class="w-full p-2 border border-slate-300 rounded-lg bg-white text-xs"></div>
            <div class="col-span-2"><label class="block text-[10px] text-slate-500 mb-1">記録日</label><input type="date" id="formDate" class="w-full p-2 border border-slate-300 rounded-lg bg-white text-xs"></div>
            <div class="col-span-2 flex items-center justify-between gap-2"><span id="formLocationStatus" class="text-[10px] text-slate-500">店舗位置：未登録</span><button type="button" onclick="captureStoreLocation()" class="shrink-0 px-2.5 py-1.5 rounded-md border border-blue-200 bg-blue-50 text-blue-700 text-[10px] font-semibold"><i class="fa-solid fa-location-dot mr-1"></i>現在地を店舗位置に記録</button></div>
            <input type="hidden" id="formLat"><input type="hidden" id="formLng">
          </div>
        </div>

        <div class="rounded-lg border border-slate-200 p-2.5 space-y-1.5">
          <label class="block text-[11px] font-medium text-slate-600">商品画像</label>
          <input type="hidden" id="formImageData">
          <input type="file" id="formImageFile" accept="image/*" onchange="handleProductImageSelect(event)" class="block w-full text-xs text-slate-600">
          <div id="formImagePreviewWrap" class="hidden flex items-center gap-3">
            <img id="formImagePreview" alt="商品画像プレビュー" class="w-20 h-20 object-contain rounded-lg border border-slate-200 bg-white">
            <button type="button" onclick="clearProductImage()" class="px-3 py-1.5 border rounded-lg text-xs text-red-600">画像を削除</button>
          </div>
          <p class="text-[10px] text-slate-500">画像は縮小して保存します。登録時・編集時のどちらでも変更できます。</p>
        </div>

        <div>
          <label class="block text-[11px] font-medium text-slate-600 mb-0.5">備考欄</label>
          <textarea id="formMemo" rows="2" class="w-full p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="特売情報やメモなど"></textarea>
        </div>

        <!-- 登録・編集ボタン / 削除ボタン -->
        <div class="pt-2 flex justify-between items-center">
          <div>
            <button type="button" id="deleteBtn" onclick="handleDeleteItem()" class="hidden px-3.5 py-2 bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 rounded-lg text-xs font-medium transition">削除する</button>
          </div>
          <div class="flex space-x-2">
            <button type="button" onclick="closeItemModal()" class="px-4 py-2 border rounded-lg text-slate-600 hover:bg-slate-100">キャンセル</button>
            <button type="submit" class="px-5 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium shadow-sm">保存する</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: 商品詳細（閲覧専用） -->
  <div id="detailModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 overflow-y-auto">
    <div class="bg-white rounded-2xl max-w-lg w-full p-4 sm:p-5 space-y-4 shadow-xl my-6">
      <div class="flex justify-between items-center border-b pb-3"><h3 class="font-bold text-slate-900 text-base">商品詳細</h3><button type="button" onclick="closeDetailModal()" class="text-slate-400"><i class="fa-solid fa-xmark text-lg"></i></button></div>
      <div id="detailContent" class="space-y-4"></div>
      <div class="flex justify-between gap-2 pt-2 border-t"><button type="button" onclick="closeDetailModal()" class="px-4 py-2 border rounded-lg text-slate-600">閉じる</button><button type="button" id="detailEditButton" onclick="editItemFromDetail()" class="px-4 py-2 bg-blue-600 text-white rounded-lg font-semibold"><i class="fa-solid fa-pen mr-1"></i>編集画面へ</button></div>
    </div>
  </div>

  <!-- JavaScript ロジック -->
  <script>
    // --- Firebase 設定 ---
    const firebaseConfig = {
      apiKey: "AIzaSyAoNZm6KwPQuWbC0W65sOh4soLMx1UoUrQ",
      authDomain: "g-account-6f48b.firebaseapp.com",
      projectId: "g-account-6f48b",
      storageBucket: "g-account-6f48b.firebasestorage.app",
      messagingSenderId: "719634797870",
      appId: "1:719634797870:web:5e6c3affbed118aa8d16bf",
      measurementId: "G-0WB2ZMX6K1"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // --- アプリケーション状態 ---
    let currentUser = null;
    let currentDbType = 'personal';
    let selectedTag = null;
    let map = null;
    let cloudLoadInProgress = false;
    let cloudSaveQueue = Promise.resolve();
    let legacyItemsForMigration = [];

    const sampleItems = [];
    function readLocalJson(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        if (raw === null) return fallback;
        const parsed = JSON.parse(raw);
        return parsed;
      } catch (err) {
        console.error('保存データの読み込みに失敗:', key, err);
        return fallback;
      }
    }
    legacyItemsForMigration = readLocalJson('smart_item_db', []);
    if (!Array.isArray(legacyItemsForMigration)) legacyItemsForMigration = [];
    // 旧版に同梱していた見本商品だけを除去し、ユーザーが登録した商品は保持する。
    legacyItemsForMigration = legacyItemsForMigration.filter(i => !(i && i.id === 'item_1' && i.jan === '4901777018686' && String(i.name || '').includes('天然水')));
    // 旧バージョンの個人データを初回ログインまで保護するため、移行候補を別キーに退避。
    try {
      if (localStorage.getItem('smart_item_db_legacy_personal') === null) {
        const legacyPersonal = readLocalJson('smart_item_db_legacy_personal', legacyItemsForMigration.filter(i => i && i.dbType !== 'open')) || [];
        if (legacyPersonal.length) localStorage.setItem('smart_item_db_legacy_personal', JSON.stringify(legacyPersonal));
      }
    } catch (e) { console.warn('旧個人データの移行バックアップに失敗:', e); }
    // 個人データはログイン後にアカウント別Firestoreから読み込む。未ログイン時はオープンDBのみ表示。
    let localItems = legacyItemsForMigration.filter(i => i && i.dbType === 'open');
    let appSettings = readLocalJson('smart_item_settings', { yahooId: "", amazonTag: "" }) || { yahooId: "", amazonTag: "" };
    let scannerActive = false;
    let scannerStarting = false;
    let scanPurpose = 'register';
    let lastScanCode = '';
    let lastScanCount = 0;
    let lastScanAt = 0;
    let scanQualitySum = 0;
    let scanSessionId = 0;
    let scanConfirmed = false;

    document.addEventListener("DOMContentLoaded", () => {
      initAuth();
      renderItems();
      renderTags();
      setupEnterNavigation();
    });

    // --- 認証・アカウント別データ読み込み ---
    function initAuth() {
      auth.onAuthStateChanged(async user => {
        currentUser = user;
        renderUserInfo();
        if (user) {
          await loadAccountItems(user);
        } else {
          localItems = legacyItemsForMigration.filter(i => i && i.dbType === 'open');
          updateStorageStatus('ログインすると個人データを同期', 'text-amber-600');
          renderTags(); renderItems();
        }
      });
    }

    function updateStorageStatus(message, colorClass = 'text-emerald-600') {
      const el = document.getElementById('storageStatus');
      if (!el) return;
      el.className = colorClass;
      el.textContent = '· ' + message;
    }

    function personalCollection(user = currentUser) {
      if (!user) throw new Error('個人データの保存にはログインが必要です。');
      return db.collection('users').doc(user.uid).collection('personalItems');
    }

    async function loadAccountItems(user) {
      if (cloudLoadInProgress) return;
      cloudLoadInProgress = true;
      updateStorageStatus('アカウントデータを読み込み中…', 'text-blue-600');
      try {
        const collection = personalCollection(user);
        let snapshot = await collection.get();
        let accountItems = snapshot.docs.map(doc => ({ ...doc.data(), id: doc.id, dbType: 'personal' }));

        // 初回ログイン時のみ、従来の端末保存データをこのアカウントへ移行する。
        if (snapshot.empty) {
          const legacyPersonal = readLocalJson('smart_item_db_legacy_personal', legacyItemsForMigration.filter(i => i && i.dbType !== 'open')) || [];
          if (legacyPersonal.length) {
            const batch = db.batch();
            legacyPersonal.forEach(item => {
              const id = String(item.id || ('item_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7)));
              const ref = collection.doc(id);
              batch.set(ref, { ...item, id, dbType: 'personal', ownerUid: user.uid });
            });
            await batch.commit();
            try { localStorage.removeItem('smart_item_db_legacy_personal'); } catch (_) {}
            snapshot = await collection.get();
            accountItems = snapshot.docs.map(doc => ({ ...doc.data(), id: doc.id, dbType: 'personal' }));
          }
        }
        const openItems = legacyItemsForMigration.filter(i => i && i.dbType === 'open');
        localItems = [...openItems, ...accountItems];
        try { localStorage.setItem('smart_item_db_' + user.uid, JSON.stringify(accountItems)); } catch (e) { console.warn('アカウント別キャッシュを保存できません:', e); }
        updateStorageStatus('アカウントに保存', 'text-emerald-600');
        renderTags(); renderItems();
      } catch (err) {
        console.error('アカウントデータ読み込み失敗:', err);
        updateStorageStatus('クラウド接続エラー', 'text-red-600');
        alert('個人データをアカウントから読み込めませんでした。Firestoreのアクセスルールと通信状態を確認してください。\n' + err.message);
      } finally {
        cloudLoadInProgress = false;
      }
    }

    async function syncPersonalItemsToCloud(user = currentUser, personalItems = localItems.filter(i => i && i.dbType === 'personal')) {
      if (!user) throw new Error('個人データの保存にはGoogleログインが必要です。');
      const collection = personalCollection(user);
      const snapshot = await collection.get();
      const keepIds = new Set(personalItems.map(i => String(i.id)));
      const operations = [];
      personalItems.forEach(item => operations.push({ type: 'set', id: String(item.id), data: { ...item, id: String(item.id), dbType: 'personal', ownerUid: user.uid } }));
      snapshot.docs.forEach(doc => { if (!keepIds.has(doc.id)) operations.push({ type: 'delete', id: doc.id }); });
      for (let i = 0; i < operations.length; i += 450) {
        const batch = db.batch();
        operations.slice(i, i + 450).forEach(op => {
          const ref = collection.doc(op.id);
          if (op.type === 'delete') batch.delete(ref); else batch.set(ref, op.data);
        });
        await batch.commit();
      }
      try { localStorage.setItem('smart_item_db_' + user.uid, JSON.stringify(personalItems)); } catch (e) { console.warn('アカウント別キャッシュ保存失敗:', e); }
      updateStorageStatus('アカウントに保存', 'text-emerald-600');
    }

    function setupEnterNavigation() {
      const form = document.getElementById('itemForm');
      if (!form) return;
      form.addEventListener('keydown', event => {
        if (event.key !== 'Enter' || event.isComposing) return;
        const target = event.target;
        if (!(target instanceof HTMLInputElement || target instanceof HTMLTextAreaElement)) return;
        if (target.type === 'hidden' || target.type === 'button' || target.type === 'submit') return;
        event.preventDefault();
        const fields = Array.from(form.querySelectorAll('input:not([type="hidden"]):not([type="button"]):not([type="submit"]), textarea, select'))
          .filter(el => !el.disabled && el.offsetParent !== null);
        const index = fields.indexOf(target);
        if (index >= 0 && index < fields.length - 1) {
          fields[index + 1].focus();
          if (typeof fields[index + 1].select === 'function' && fields[index + 1].tagName === 'INPUT' && fields[index + 1].type !== 'date') fields[index + 1].select();
        } else {
          form.requestSubmit();
        }
      });
    }

    function handleProductImageSelect(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      if (!file.type.startsWith('image/')) { alert('画像ファイルを選択してください。'); event.target.value = ''; return; }
      const reader = new FileReader();
      reader.onload = () => {
        const source = new Image();
        source.onload = () => {
          const maxSide = 1000;
          const scale = Math.min(1, maxSide / Math.max(source.width, source.height));
          const canvas = document.createElement('canvas');
          canvas.width = Math.max(1, Math.round(source.width * scale));
          canvas.height = Math.max(1, Math.round(source.height * scale));
          canvas.getContext('2d').drawImage(source, 0, 0, canvas.width, canvas.height);
          const data = canvas.toDataURL('image/jpeg', 0.78);
          document.getElementById('formImageData').value = data;
          updateProductImagePreview(data);
        };
        source.onerror = () => { alert('画像を読み込めませんでした。別の画像をお試しください。'); };
        source.src = reader.result;
      };
      reader.onerror = () => alert('画像ファイルを読み込めませんでした。');
      reader.readAsDataURL(file);
    }

    function editStoreRecord(itemId, index) {
      const item = localItems.find(i => String(i.id) === String(itemId));
      if (!item || !Array.isArray(item.stores) || !item.stores[index]) return;
      if (item.dbType !== 'open' && !currentUser) { alert('個人データを編集するにはGoogleログインが必要です。'); return; }
      const st = item.stores[index];
      const name = prompt('店舗名', st.name || ''); if (name === null) return;
      const branch = prompt('支店名（不要なら空欄）', st.branch || ''); if (branch === null) return;
      const date = prompt('登録日（YYYY-MM-DD）', st.date || ''); if (date === null) return;
      const priceText = prompt('税抜価格（数字）', st.price == null ? '' : String(st.price)); if (priceText === null) return;
      if (priceText.trim() !== '' && (!Number.isFinite(Number(priceText)) || Number(priceText) < 0)) { alert('価格は0以上の数字で入力してください。'); return; }
      item.stores[index] = { ...st, name: name.trim(), branch: branch.trim(), date: date.trim(), price: priceText.trim() === '' ? '' : Number(priceText) };
      item.updatedAt = new Date().toISOString();
      if (!saveLocalStorage()) return;
      showItemDetails(item.id); renderItems();
    }
    function deleteStoreRecord(itemId, index) {
      const item = localItems.find(i => String(i.id) === String(itemId));
      if (!item || !Array.isArray(item.stores) || !item.stores[index]) return;
      if (item.dbType !== 'open' && !currentUser) { alert('個人データを編集するにはGoogleログインが必要です。'); return; }
      const st = item.stores[index];
      if (!confirm(`この店舗の価格記録を削除しますか？\n${[st.name, st.branch, st.date].filter(Boolean).join(' / ')}`)) return;
      item.stores.splice(index, 1);
      item.updatedAt = new Date().toISOString();
      if (!saveLocalStorage()) return;
      showItemDetails(item.id); renderItems();
    }

    function renderTags() {

      if (container) container.innerHTML = '';

    function splitTags(value) {
      return [...new Set(String(value || '').split(/[,、]/).map(t => t.trim()).filter(Boolean))];
    }

    function renderTagSuggestions() {
      const input = document.getElementById('formTags');
      const box = document.getElementById('tagSuggestions');
      if (!input || !box) return;
      const value = input.value;
      const parts = value.split(/[,、]/);
      const current = (parts[parts.length - 1] || '').trim().toLowerCase();
      const used = parts.slice(0, -1).map(t => t.trim().toLowerCase()).filter(Boolean);
      // 入力が空のときは候補を大量表示しない。入力文字に一致する既存タグだけ候補に出す。
      if (!current) { box.innerHTML = ''; return; }
      const all = new Set();
      localItems.forEach(item => (item.tags || []).forEach(tag => all.add(String(tag))));
      const suggestions = [...all]
        .filter(tag => !used.includes(tag.toLowerCase()) && tag.toLowerCase().includes(current))
        .sort((a, b) => (a.toLowerCase().startsWith(current) ? 0 : 1) - (b.toLowerCase().startsWith(current) ? 0 : 1))
        .slice(0, 5);
      box.innerHTML = suggestions.map(tag => `<button type="button" class="px-2 py-1 rounded-md bg-blue-50 text-blue-700 border border-blue-100 text-[10px]" onclick="addTagSuggestion('${escapeHtml(tag).replace(/'/g, '&#39;')}')">${escapeHtml(tag)}</button>`).join('');
    }

    function addTagSuggestion(tag) {
      const input = document.getElementById('formTags');
      const parts = input.value.split(/[,、]/);
      parts.pop();
      const existing = parts.map(t => t.trim()).filter(Boolean);
      if (!existing.some(t => t.toLowerCase() === tag.toLowerCase())) existing.push(tag);
      input.value = existing.join('、') + '、';
      input.focus();
      renderTagSuggestions();
    }

    // --- JANコードカメラ読み取り（JAN Master ProのQuagga2方式） ---
    function openScanModal() {
      scanPurpose = 'register';
      document.getElementById('scanModal').classList.remove('hidden');
      startScanCamera();
    }

    function openJanFieldScanModal() {
      scanPurpose = 'registerField';

    }

    function openSearchScanModal() {

      document.getElementById('scanModal').classList.remove('hidden');
      startScanCamera();

    async function startScanCamera() {
      if (scannerActive || scannerStarting) return;
      scannerStarting = true;
      scanConfirmed = false;
      const thisSession = ++scanSessionId;
      const status = document.getElementById('scanStatus');
      status.textContent = 'カメラを起動しています…';
      const reader = document.getElementById('reader');
      reader.innerHTML = '';
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        scannerStarting = false;
        status.textContent = 'カメラを利用できません。HTTPSで開いているか確認してください。';
        return;
      }
      if (!window.Quagga || typeof Quagga.init !== 'function') {
        scannerStarting = false;
        status.textContent = 'バーコード読取ライブラリを読み込めませんでした。';
        return;
      }
      try {
        try { Quagga.offDetected(onScanDetected); Quagga.stop(); } catch (_) {}
        Quagga.init({
          inputStream: { name: 'Live', type: 'LiveStream', target: reader, constraints: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 }, aspectRatio: { ideal: 1.777 } }, area: { top: '28%', right: '6%', left: '6%', bottom: '28%' } },
          locator: { patchSize: 'medium', halfSample: false },
          numOfWorkers: navigator.hardwareConcurrency ? Math.min(3, Math.max(1, navigator.hardwareConcurrency - 1)) : 2,
          frequency: 15,
          decoder: { readers: ['ean_reader', 'ean_8_reader', 'upc_reader', 'i2of5_reader'] },
          locate: true
        }, err => {
          if (thisSession !== scanSessionId) { try { Quagga.stop(); } catch (_) {} return; }
          scannerStarting = false;
          if (err) {
            console.error('Quagga init error:', err);
            status.textContent = 'カメラを起動できませんでした。カメラ権限とHTTPSを確認してください。';
            return;
          }
          try {
            Quagga.offDetected(onScanDetected);
            Quagga.onDetected(onScanDetected);
            Quagga.start();
            scannerActive = true;
            scannerStarting = false;
            status.textContent = 'バーコード全体を緑の枠に水平に合わせ、ピントが合うまで静止してください。3回連続で一致すると停止します。';
            const track = Quagga.CameraAccess && Quagga.CameraAccess.getActiveTrack ? Quagga.CameraAccess.getActiveTrack() : null;
            if (track && track.applyConstraints) {
              const caps = track.getCapabilities ? track.getCapabilities() : {};
              if (caps.focusMode && caps.focusMode.includes('continuous')) track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(() => {});
            }
          } catch (err2) {
            console.error('Quagga start error:', err2);
            scannerStarting = false;
            stopScanCamera();
            status.textContent = 'カメラ開始に失敗しました。再読み込みをお試しください。';
          }
        });
      } catch (err) {
        console.error(err);
        scannerStarting = false;
        status.textContent = 'カメラ設定でエラーが発生しました。';
      }
    }

    function validJanOrItf(code) {
      const value = String(code || '').replace(/\D/g, '');
      if (!/^\d{8}$|^\d{12}$|^\d{13}$|^\d{14}$/.test(value)) return false;
      const body = value.slice(0, -1).split('').reverse();
      let sum = 0;
      body.forEach((digit, index) => sum += Number(digit) * (index % 2 === 0 ? 3 : 1));
      return (10 - (sum % 10)) % 10 === Number(value.slice(-1));
    }

    function onScanDetected(result) {
      if (!scannerActive || scanConfirmed) return;
      const raw = result && result.codeResult && result.codeResult.code;
      const code = String(raw || '').replace(/\D/g, '');
      if (!validJanOrItf(code)) return;
      const now = Date.now();
      if (code === lastScanCode && now - lastScanAt < 2600) lastScanCount++;
      else { lastScanCode = code; lastScanCount = 1; scanQualitySum = 0; }
      lastScanAt = now;
      // チェックデジットが正しい同一コードを3回連続で検出した場合だけ確定する。
      if (lastScanCount < 3) return;
      scanConfirmed = true;
      lastScanCount = 0;
      document.getElementById('scanStatus').textContent = '読み取り成功：' + code + '（カメラ停止中…）';
      stopScanCamera();
      setTimeout(() => {
        const modal = document.getElementById('scanModal');
        if (modal && !modal.classList.contains('hidden')) modal.classList.add('hidden');
        if (scanPurpose === 'search') {
          const searchInput = document.getElementById('searchInput');
          searchInput.value = code;
          renderItems();
          searchInput.focus();
          document.getElementById('scanStatus').textContent = '検索コード：' + code;
          scanPurpose = 'register';
        } else if (scanPurpose === 'registerField') {
          document.getElementById('formJan').value = code;
          document.getElementById('scanStatus').textContent = 'JAN入力完了：' + code;
          document.getElementById('formJan').focus();
          scanPurpose = 'register';
        } else {
          openItemModalWithJan(code);
        }
      }, 120);
    }

    function stopScanCamera() {
      scannerActive = false;
      scannerStarting = false;
      scanSessionId++; // 起動途中のコールバックが後からカメラを再開しないよう無効化
      try { if (window.Quagga) { Quagga.offDetected(onScanDetected); Quagga.stop(); } } catch (err) { console.debug('scanner cleanup', err); }
      try { if (window.Quagga && Quagga.CameraAccess && Quagga.CameraAccess.release) Quagga.CameraAccess.release(); } catch (_) {}
      const reader = document.getElementById('reader');
      if (reader) reader.querySelectorAll('video').forEach(v => {
        try { v.pause(); const stream = v.srcObject; if (stream) stream.getTracks().forEach(t => { t.stop(); }); v.srcObject = null; } catch (_) {}
      });
    }

    function restartScanCamera() {
      stopScanCamera();
      lastScanCode = ''; lastScanCount = 0; lastScanAt = 0; scanQualitySum = 0; scanConfirmed = false;
      startScanCamera();
    }

    function closeScanModal() {
      stopScanCamera();
      document.getElementById('scanModal').classList.add('hidden');
    }

    function openItemModalWithJan(jan) {
      openItemModal();
      document.getElementById('formJan').value = jan;
      // 読取直後の外部検索は自動実行せず、商品登録を優先。必要ならYahoo!検索を押す。

    // --- Yahoo! API呼び出し (HTML単体でCORS回避プロキシ経由) ---
    async function fetchProductByYahooApi(searchQuery = "") {
      const clientId = appSettings.yahooId;
      const jan = searchQuery || document.getElementById('formJan').value;
      const name = document.getElementById('formName').value;
      const query = jan || name;

      if (!query) {
        alert("商品名またはJANコードを入力してください");
        return;
      }

      if (!clientId) {
        alert("Yahoo! APIの Client ID が設定されていません。「API・EC設定」タブから登録してください。");
        return;
      }

      const btn = document.getElementById('apiSearchBtn');
      if (!btn) return;
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-1"></i>検索中...`;

      try {
        // JANらしい入力はJAN専用パラメータで検索し、ショップ独自の商品コードをJANと誤認しない。
        const params = new URLSearchParams({ appid: clientId, results: '10' });
        if (/^\d{8}$|^\d{12,14}$/.test(query)) params.set('jan_code', query);
        else params.set('query', query);
        const targetUrl = `https://shopping.yahooapis.jp/ShoppingWebService/V3/itemSearch?${params.toString()}`;
        // 暫定プロキシ。公開運用ではAPIキーをサーバー側に置いた自前の中継処理を推奨。
        const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`;
        const res = await fetch(proxyUrl);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        const hits = Array.isArray(data.hits) ? data.hits : [];
        const item = hits.find(hit => !/^\d{8}$|^\d{12,14}$/.test(query) || String(hit.janCode || '') === query) || hits[0];

        if (item) {
          document.getElementById('formName').value = item.name || document.getElementById('formName').value;
          // APIの code はショップの商品コードなので、janCodeがある場合だけJAN欄を更新する。
          if (item.janCode) document.getElementById('formJan').value = item.janCode;
          if (item.price !== undefined && item.price !== null) {
            document.getElementById('formPrice').value = item.price;
            document.getElementById('formStore').value = (item.seller && item.seller.name) ? item.seller.name : 'Yahoo!ショッピング';
          }
          alert(`Yahoo!ショッピングから商品情報を取得しました。\n価格: ¥${Number(item.price || 0).toLocaleString()}\n※商品・JANの一致を確認してから保存してください。`);
        } else {
          alert('該当する商品が見つかりませんでした。');
        }
      } catch (e) {
        console.error('API呼び出しエラー', e);
        alert('API検索に失敗しました。Client ID、APIの利用条件、通信状態を確認してください。');
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-magnifying-glass mr-1"></i>Yahoo!検索`;
      }
    }

    function closeItemModal() {
      document.getElementById('itemModal').classList.add('hidden');
    }

    function handleSaveItem(e) {
      e.preventDefault();
      const id = document.getElementById('editItemId').value || 'item_' + Date.now();
      const maker = document.getElementById('formMaker').value.trim();
      const name = document.getElementById('formName').value.trim();
      const flavor = document.getElementById('formFlavor').value.trim();
      const content = document.getElementById('formContent').value.trim();
      const taxType = document.getElementById('formTaxType').value === 'other' ? 'other' : 'food';
      const jan = document.getElementById('formJan').value;
      const tagsStr = document.getElementById('formTags').value;
      const storeName = document.getElementById('formStore').value;
      const storeBranch = document.getElementById('formBranch').value;
      const price = document.getElementById('formPrice').value;
      const date = document.getElementById('formDate').value || new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
      const memo = document.getElementById('formMemo').value;
      const imageData = document.getElementById('formImageData').value || '';

      const tags = splitTags(tagsStr);
      const idx = localItems.findIndex(i => i.id === id);
      const existing = idx >= 0 ? localItems[idx] : null;
      // 編集時は過去の店舗価格を保持。入力された店舗だけを追加・更新する。
      const stores = existing && Array.isArray(existing.stores) ? [...existing.stores] : [];
      if (storeName.trim() && price !== '' && Number.isFinite(Number(price)) && Number(price) >= 0) {
        const normalizedName = storeName.trim();
        const normalizedBranch = storeBranch.trim();
        const storeIdx = stores.findIndex(st => String(st.name).trim().toLowerCase() === normalizedName.toLowerCase() && String(st.branch || '').trim().toLowerCase() === normalizedBranch.toLowerCase() && String(st.date || '') === date);
        const record = { name: normalizedName, branch: normalizedBranch, price: Number(price), date, lat: document.getElementById('formLat').value || (storeIdx >= 0 ? stores[storeIdx].lat : ''), lng: document.getElementById('formLng').value || (storeIdx >= 0 ? stores[storeIdx].lng : '') };
        if (storeIdx >= 0) stores[storeIdx] = record;
        else stores.push(record);
      }
      const newItem = { id, maker, name, flavor, content, taxType, jan: jan.trim(), tags, memo: memo.trim(), imageData, stores, dbType: existing ? existing.dbType : currentDbType, updatedAt: new Date().toISOString() };
      if (idx >= 0) localItems[idx] = newItem;
      else localItems.unshift(newItem);

      if (!saveLocalStorage()) return;
      closeItemModal();
      renderTags();
      renderItems();
    }

    function handleDeleteItem() {
      const id = document.getElementById('editItemId').value;
      if (!id) return;

      if (confirm("この商品をデータベースから削除してもよろしいですか？")) {
        localItems = localItems.filter(i => i.id !== id);
        if (!saveLocalStorage()) return;
        closeItemModal();
        renderTags();
        renderItems();
      }
    }

    // --- DBマージ ---
    function triggerMerge() {
      const personal = localItems.filter(i => i.dbType === 'personal');
      const open = localItems.filter(i => i.dbType === 'open');
      if (!open.length) { alert('マージ対象のオープンDB商品がありません。'); return; }
      if (!confirm('オープンDBの商品情報を個人DBに取り込みます。同じJANの商品は店舗価格・タグを統合し、個人のメモは保持します。続行しますか？')) return;
      let added = 0, merged = 0;
      open.forEach(source => {
        const target = source.jan ? localItems.find(i => i.dbType === 'personal' && i.jan && i.jan === source.jan) : null;
        if (!target) {
          const copy = JSON.parse(JSON.stringify(source));
          copy.id = 'item_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
          copy.dbType = 'personal'; copy.importedFrom = source.id;
          localItems.unshift(copy); added++;
        } else {
          const stores = Array.isArray(target.stores) ? [...target.stores] : [];
          (source.stores || []).forEach(st => {
            const duplicate = stores.some(x => String(x.name).trim().toLowerCase() === String(st.name).trim().toLowerCase() && String(x.branch || '').trim().toLowerCase() === String(st.branch || '').trim().toLowerCase() && String(x.date || '') === String(st.date || '') && Number(x.price) === Number(st.price));
            if (!duplicate) stores.push({ ...st });
          });
          target.stores = stores;
          target.tags = [...new Set([...(target.tags || []), ...(source.tags || [])])];
          if (!target.name && source.name) target.name = source.name;
          target.updatedAt = new Date().toISOString();
          merged++;
        }
      });
      if (!saveLocalStorage()) return;
      renderTags(); renderItems();
      alert(`マージ完了：新規取り込み ${added} 件、既存商品の統合 ${merged} 件。\n元のオープンDB商品は削除していません。`);
    }

    function escapeHtml(value) { return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }

    function updateFormLocationStatus() {
      const lat = document.getElementById('formLat')?.value, lng = document.getElementById('formLng')?.value;
      const el = document.getElementById('formLocationStatus');
      if (el) el.textContent = lat && lng ? `店舗位置：登録済み（${Number(lat).toFixed(4)}, ${Number(lng).toFixed(4)}）` : '店舗位置：未登録';
    }
    function captureStoreLocation() {
      if (!navigator.geolocation) { alert('この環境では位置情報を取得できません。'); return; }
      navigator.geolocation.getCurrentPosition(pos => {
        document.getElementById('formLat').value = pos.coords.latitude;
        document.getElementById('formLng').value = pos.coords.longitude;
        updateFormLocationStatus();
      }, () => alert('位置情報を取得できませんでした。ブラウザの位置情報許可を確認してください。'), {enableHighAccuracy:true, timeout:10000});
    }

    // --- 店舗マップ (Leaflet) ---
    let mapMarkers = [];
    let userLocationMarker = null;
    function getMapStoreRecords() {
      return localItems.flatMap(item => (Array.isArray(item.stores) ? item.stores : []).map((st, index) => ({...st, itemName:item.name || '名称未設定', itemId:item.id, itemDbType:item.dbType, recordIndex:index})).filter(st => st.name || st.branch));
    }
    function initMap() {
      if (map) { setTimeout(() => map.invalidateSize(), 120); refreshStoreMap(); return; }
      map = L.map('map', { zoomControl:true }).setView([36.2, 138.2], 5);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19, attribution:'© OpenStreetMap contributors' }).addTo(map);
      refreshStoreMap();
    }
    function refreshStoreMap() {
      if (!map) return;
      mapMarkers.forEach(marker => map.removeLayer(marker)); mapMarkers = [];
      const records = getMapStoreRecords();
      const located = records.filter(st => Number.isFinite(Number(st.lat)) && Number.isFinite(Number(st.lng)) && st.lat !== '' && st.lng !== '');
      document.getElementById('mapStoreCount').textContent = records.length;
      document.getElementById('mapPinCount').textContent = located.length;
      const list = document.getElementById('mapStoreList');
      if (!records.length) list.innerHTML = '<p class="text-xs text-slate-500 py-2">店舗の価格記録がまだありません。商品登録時に店舗名・支店名を入力すると、ここに一覧表示されます。</p>';
      else list.innerHTML = records.slice().sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))).map(st => `<div class="flex items-center justify-between gap-2 border-b border-slate-100 last:border-0 py-2"><div class="min-w-0"><p class="text-xs font-semibold text-slate-800 truncate">${escapeHtml(st.name || '店舗名未登録')}${st.branch ? ' / '+escapeHtml(st.branch) : ''}</p><p class="text-[10px] text-slate-500 truncate">${escapeHtml(st.itemName)} · ${escapeHtml(st.date || '日付なし')} · ${st.price === '' || st.price == null ? '価格未登録' : '¥'+Number(st.price).toLocaleString()}</p></div>${Number.isFinite(Number(st.lat)) && Number.isFinite(Number(st.lng)) && st.lat !== '' && st.lng !== '' ? `<button onclick="focusStoreMap(${Number(st.lat)},${Number(st.lng)})" class="shrink-0 text-[10px] px-2 py-1 rounded-md bg-blue-50 text-blue-700">地図で見る</button>` : '<span class="shrink-0 text-[10px] text-slate-400">位置未登録</span>'}</div>`).join('');
      located.forEach(st => { const marker = L.marker([Number(st.lat), Number(st.lng)]).addTo(map).bindPopup(`<b>${escapeHtml(st.name || '店舗')}</b>${st.branch ? ' / '+escapeHtml(st.branch) : ''}<br>${escapeHtml(st.itemName)}<br>${st.price === '' || st.price == null ? '価格未登録' : '¥'+Number(st.price).toLocaleString()}`); mapMarkers.push(marker); });
      if (located.length) fitStoreMap();
    }
    function fitStoreMap() {
      if (!map) return;
      if (mapMarkers.length === 1) map.setView(mapMarkers[0].getLatLng(), 15);
      else if (mapMarkers.length > 1) map.fitBounds(L.featureGroup(mapMarkers).getBounds().pad(0.18), {maxZoom:15});
      else map.setView([36.2, 138.2], 5);
    }
    function focusStoreMap(lat, lng) { if (map) { map.setView([lat,lng], 16); } }
    function locateUser() {
      if (!navigator.geolocation || !map) { alert('この環境では現在地を取得できません。'); return; }
      navigator.geolocation.getCurrentPosition(pos => {
        const lat = pos.coords.latitude, lng = pos.coords.longitude;
        if (userLocationMarker) map.removeLayer(userLocationMarker);
        userLocationMarker = L.circleMarker([lat,lng], {radius:9,color:'#fff',weight:3,fillColor:'#2563eb',fillOpacity:1}).addTo(map).bindPopup('現在地').openPopup();
        map.setView([lat,lng], 15);
      }, err => alert('現在地を取得できませんでした。位置情報の許可設定をご確認ください。'), {enableHighAccuracy:true, timeout:10000});
    }

    function saveLocalStorage() {
      try {
        // オープンDBは端末保存。個人DBはUID別キャッシュ＋Firestoreへ保存。
        const openItems = localItems.filter(i => i && i.dbType === 'open');
        localStorage.setItem('smart_item_db_open', JSON.stringify(openItems));
        localStorage.setItem('smart_item_db', JSON.stringify(openItems));
      } catch (err) {
        console.error('端末データ保存失敗:', err);
        alert('端末内データを保存できませんでした。ブラウザの保存容量や設定を確認してください。');
        return false;
      }
      const personalItems = localItems.filter(i => i && i.dbType === 'personal');
      if (personalItems.length && !currentUser) {
        alert('個人DBの保存にはGoogleログインが必要です。データはクラウド保存されていません。ログイン後にもう一度操作してください。');
        return false;
      }
      if (currentUser) {
        // 通信失敗時にも再読込で復旧できるよう、先にUID別キャッシュへ退避。
        try { localStorage.setItem('smart_item_db_' + currentUser.uid, JSON.stringify(personalItems)); } catch (_) {}
        updateStorageStatus('クラウド保存中…', 'text-blue-600');
        const saveUser = currentUser;
        const itemsToSave = personalItems.map(item => ({ ...item }));
        cloudSaveQueue = cloudSaveQueue.then(() => syncPersonalItemsToCloud(saveUser, itemsToSave)).catch(err => {
          console.error('個人データのクラウド保存に失敗:', err);
          updateStorageStatus('保存エラー', 'text-red-600');
          alert('個人データをアカウントへ保存できませんでした。Firestoreのアクセスルールと通信状態を確認してください。\n' + err.message);
        });
      }
      return true;
    }
  </script>
</body>
</html>
