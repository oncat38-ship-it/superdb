<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Item DB - 商品＆価格管理データベース</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts & FontAwesome -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Leaflet CSS & JS (店舗マップ用) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- html5-qrcode (JANバーコードスキャナ) -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <!-- Firebase v10 Compat -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    body { font-family: 'Inter', sans-serif; }
    .nav-active { color: #2563eb; border-bottom: 2px solid #2563eb; }
    #reader video, #modalReader video { border-radius: 0.5rem; width: 100% !important; object-fit: cover; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

  <!-- ヘッダー -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-2.5">
        <div class="bg-blue-600 text-white p-2 rounded-xl text-lg font-bold shadow-sm">
          <i class="fa-solid fa-barcode"></i>
        </div>
        <div>
          <h1 class="text-base font-bold leading-tight text-slate-900">Smart Item DB</h1>
          <p class="text-[11px] text-slate-500">店舗＆EC最安値データベース</p>
        </div>
      </div>

      <!-- ログイン状況・ユーザーエリア -->
      <div id="userInfoArea" class="flex items-center space-x-3">
        <!-- JS動的描画 -->
      </div>
    </div>

    <!-- ナビゲーションタブ -->
    <nav class="max-w-6xl mx-auto px-4 flex space-x-6 text-sm font-medium border-t border-slate-100 overflow-x-auto">
      <button onclick="switchTab('items')" id="tab-items" class="py-2.5 nav-active whitespace-nowrap">
        <i class="fa-solid fa-boxes-stacked mr-1.5"></i>商品・価格一覧
      </button>
      <button onclick="switchTab('map')" id="tab-map" class="py-2.5 text-slate-600 hover:text-blue-600 whitespace-nowrap">
        <i class="fa-solid fa-map-location-dot mr-1.5"></i>店舗マップ・検索
      </button>
      <button onclick="switchTab('settings')" id="tab-settings" class="py-2.5 text-slate-600 hover:text-blue-600 whitespace-nowrap">
        <i class="fa-solid fa-gear mr-1.5"></i>アプリ設定
      </button>
    </nav>
  </header>

  <!-- メインコンテンツ -->
  <main class="flex-1 max-w-6xl w-full mx-auto p-4 space-y-4">

    <!-- TAB 1: 商品一覧＆データベース -->
    <section id="view-items" class="space-y-4">
      
      <!-- DB切り替え & アクションバー -->
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col md:flex-row gap-3 items-stretch md:items-center justify-between">
        <!-- 個人 / オープン DB切り替え -->
        <div class="flex bg-slate-100 p-1 rounded-lg self-start">
          <button id="dbTypePersonal" onclick="setDbType('personal')" class="px-4 py-1.5 text-xs font-semibold rounded-md bg-white text-blue-600 shadow-sm transition">
            <i class="fa-solid fa-user mr-1"></i>個人 DB
          </button>
          <button id="dbTypeOpen" onclick="setDbType('open')" class="px-4 py-1.5 text-xs font-semibold rounded-md text-slate-600 hover:text-slate-900 transition">
            <i class="fa-solid fa-earth-americas mr-1"></i>オープン DB (公開)
          </button>
        </div>

        <!-- 各種アクションボタン -->
        <div class="flex flex-wrap gap-2">
          <button onclick="openScanModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-3.5 py-2 rounded-lg text-xs font-medium flex items-center shadow-sm transition">
            <i class="fa-solid fa-camera mr-1.5"></i>JANスキャン
          </button>
          <button onclick="openItemModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3.5 py-2 rounded-lg text-xs font-medium flex items-center shadow-sm transition">
            <i class="fa-solid fa-plus mr-1.5"></i>商品登録
          </button>
          <button onclick="triggerMerge()" class="bg-slate-800 hover:bg-slate-900 text-white px-3.5 py-2 rounded-lg text-xs font-medium flex items-center shadow-sm transition" title="オープンDBと個人DBをマージします">
            <i class="fa-solid fa-code-merge mr-1.5"></i>DBマージ
          </button>
        </div>
      </div>

      <!-- 検索・フィルターバー -->
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm space-y-3">
        <div class="relative">
          <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-400 text-sm"></i>
          <input type="text" id="searchInput" oninput="filterItems()" placeholder="メーカー、商品名、JAN、店舗名で検索..." class="w-full pl-10 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs md:text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <!-- タグバッジ一覧 -->
        <div id="tagContainer" class="flex flex-wrap gap-1.5 pt-0.5 text-xs">
          <!-- JS動的生成 -->
        </div>
      </div>

      <!-- 商品グリッドカード -->
      <div id="itemList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <!-- JS動的描画 -->
      </div>
    </section>

    <!-- TAB 2: 店舗マップ＆検索 -->
    <section id="view-map" class="hidden space-y-4">
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm space-y-3">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-2">
          <div>
            <h2 class="font-bold text-slate-800 text-sm">店舗マップ・高精度エリア検索</h2>
            <p class="text-xs text-slate-500">登録された店舗や支店名を自動で地図上に反映・検索できます。</p>
          </div>
          <button onclick="locateUser()" class="bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-200 text-xs px-3.5 py-1.5 rounded-lg font-medium transition shadow-sm">
            <i class="fa-solid fa-location-crosshairs mr-1"></i>現在地を基準にする
          </button>
        </div>

        <!-- 店舗・エリア検索バー -->
        <div class="flex gap-2 pt-1">
          <input type="text" id="mapSearchInput" placeholder="店舗名や地域を入力 (例: イオン 豊橋南店、スギ薬局)" class="flex-1 p-2 border border-slate-300 rounded-lg text-xs md:text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-slate-50">
          <button onclick="searchStoreOnMap()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-xs font-medium transition shadow-sm whitespace-nowrap">
            <i class="fa-solid fa-magnifying-glass mr-1"></i>店舗を探す
          </button>
        </div>
      </div>

      <!-- 地図表示領域 -->
      <div id="map" class="w-full h-[500px] rounded-xl border border-slate-200 shadow-inner"></div>
    </section>

    <!-- TAB 3: アプリ設定 -->
    <section id="view-settings" class="hidden space-y-4">
      <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm space-y-4 max-w-2xl mx-auto text-xs md:text-sm">
        <div>
          <h2 class="font-bold text-base text-slate-900">アプリケーション設定</h2>
          <p class="text-slate-500 text-xs mt-0.5">登録した商品・価格データはローカルストレージに安全に永続保存されます。</p>
        </div>
        <div class="p-4 bg-slate-50 rounded-xl border border-slate-200 text-slate-600 text-xs space-y-1">
          <p class="font-bold text-slate-700">ステータス</p>
          <p>・Firebase Authentication 接続済み</p>
          <p>・データの自動保存（localStorage 永続化）有効</p>
        </div>
      </div>
    </section>

  </main>

  <!-- Modal: JANコードスキャナー (メイン用) -->
  <div id="scanModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-5 space-y-4 shadow-xl">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-bold text-slate-800 text-sm"><i class="fa-solid fa-camera mr-2 text-blue-600"></i>JANバーコードスキャン</h3>
        <button onclick="closeScanModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <div id="reader" class="w-full overflow-hidden bg-slate-100 rounded-lg"></div>
      <div class="text-center text-[11px] text-slate-500">バーコードをカメラの中央の枠内に合わせてください</div>
    </div>
  </div>

  <!-- Modal: 店舗参照用マップ -->
  <div id="storeMapModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-2xl w-full p-5 space-y-3 shadow-xl">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-bold text-slate-800 text-sm"><i class="fa-solid fa-map-pin mr-2 text-blue-600"></i>地図から店舗を選択</h3>
        <button onclick="closeStoreMapModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <div class="flex gap-2">
        <input type="text" id="modalMapSearchInput" placeholder="店舗名・ランドマーク名で検索" class="flex-1 p-2 border border-slate-300 rounded-lg text-xs bg-slate-50">
        <button onclick="searchStoreOnModalMap()" class="bg-blue-600 text-white px-3 py-1.5 rounded-lg text-xs">検索</button>
      </div>
      <div id="modalMap" class="w-full h-80 rounded-lg border border-slate-200"></div>
      <p class="text-[11px] text-slate-500">※地図上のピンまたは場所をタップすると店舗情報が入力されます。</p>
    </div>
  </div>

  <!-- Modal: 商品登録 / 編集 -->
  <div id="itemModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 overflow-y-auto">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 space-y-4 shadow-xl my-8 text-xs md:text-sm">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 id="modalTitle" class="font-bold text-slate-900 text-base">商品を新規登録</h3>
        <button onclick="closeItemModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>

      <form id="itemForm" onsubmit="handleSaveItem(event)" class="space-y-3">
        <input type="hidden" id="editItemId">

        <!-- 1. メーカー・ブランド / 商品名 / 内容量 -->
        <div class="space-y-2">
          <div class="grid grid-cols-3 gap-2">
            <div class="col-span-1">
              <label class="block font-medium text-slate-700 mb-1">メーカー・ブランド</label>
              <input type="text" id="formBrand" class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="例: サントリー">
            </div>
            <div class="col-span-2">
              <label class="block font-medium text-slate-700 mb-1">商品名 <span class="text-red-500">*</span></label>
              <input type="text" id="formName" required class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="例: 天然水">
            </div>
          </div>
          <div>
            <label class="block font-medium text-slate-700 mb-1">内容量</label>
            <input type="text" id="formVolume" class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="例: 2L / 500ml / 12個入">
          </div>
        </div>

        <!-- 2. JANコード（カメラ起動ボタン付き） & ジャンル（税率区分） -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block font-medium text-slate-700 mb-1">JANコード</label>
            <div class="flex gap-1.5">
              <input type="text" id="formJan" class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="4900000000000">
              <button type="button" onclick="openModalScan()" class="bg-blue-50 border border-blue-200 text-blue-600 px-3 rounded-lg hover:bg-blue-100 transition" title="カメラでJANスキャン">
                <i class="fa-solid fa-camera"></i>
              </button>
            </div>
          </div>
          <div>
            <label class="block font-medium text-slate-700 mb-1">商品ジャンル (税率)</label>
            <select id="formCategory" class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white">
              <option value="food">食品・飲料 (軽減税率 8%)</option>
              <option value="other">日用品・その他 (標準税率 10%)</option>
            </select>
          </div>
        </div>

        <!-- 3. タグ入力（読点・カンマ対応 ＆ 既登録タグサジェスト） -->
        <div>
          <label class="block font-medium text-slate-700 mb-1">タグ (読点「、」やカンマ区切り)</label>
          <input type="text" id="formTags" class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="飲料、 水、 特売">
          <!-- 既登録タグからのクイック追加 -->
          <div id="quickTagSelector" class="flex flex-wrap gap-1 mt-1.5 text-[11px] text-slate-500">
            <!-- JSで候補バッジを動的表示 -->
          </div>
        </div>

        <!-- 4. 店舗情報・価格（税抜きメイン） -->
        <div class="bg-slate-50 p-3.5 rounded-xl border border-slate-200 space-y-2.5">
          <div class="flex justify-between items-center">
            <p class="font-bold text-xs text-slate-700"><i class="fa-solid fa-store mr-1 text-blue-600"></i>店舗情報・価格の記録</p>
            <button type="button" onclick="openStoreMapModal()" class="text-[11px] text-blue-600 hover:underline flex items-center">
              <i class="fa-solid fa-map-location-dot mr-1"></i>地図から選択
            </button>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-[10px] text-slate-500 mb-0.5">店舗名</label>
              <input type="text" id="formStore" placeholder="例: イオン" class="w-full p-2 border border-slate-300 rounded-lg bg-white text-xs">
            </div>
            <div>
              <label class="block text-[10px] text-slate-500 mb-0.5">支店・エリア名</label>
              <input type="text" id="formBranch" placeholder="例: 豊橋南店" class="w-full p-2 border border-slate-300 rounded-lg bg-white text-xs">
            </div>
          </div>
          <div class="grid grid-cols-2 gap-2 pt-1">
            <div>
              <label class="block text-[10px] text-slate-500 mb-0.5">税抜き価格 (円)</label>
              <input type="number" id="formPrice" placeholder="例: 98" class="w-full p-2 border border-slate-300 rounded-lg bg-white text-xs">
            </div>
            <div>
              <label class="block text-[10px] text-slate-500 mb-0.5">購入/確認日付</label>
              <input type="date" id="formDate" class="w-full p-2 border border-slate-300 rounded-lg bg-white text-xs">
            </div>
          </div>
        </div>

        <div>
          <label class="block font-medium text-slate-700 mb-1">備考欄</label>
          <textarea id="formMemo" rows="2" class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="特売情報やメモなど"></textarea>
        </div>

        <!-- 登録・編集ボタン / 削除ボタン -->
        <div class="pt-2 flex justify-between items-center">
          <div>
            <button type="button" id="deleteBtn" onclick="handleDeleteItem()" class="hidden px-3.5 py-2 bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 rounded-lg text-xs font-medium transition">削除する</button>
          </div>
          <div class="flex space-x-2">
            <button type="button" onclick="closeItemModal()" class="px-4 py-2 border rounded-lg text-slate-600 hover:bg-slate-100">キャンセル</button>
            <button type="submit" class="px-5 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium shadow-sm">保存する</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- JavaScript ロジック -->
  <script>
    // --- Firebase 設定 ---
    const firebaseConfig = {
      apiKey: "AIzaSyAoNZm6KwPQuWbC0W65sOh4soLMx1UoUrQ",
      authDomain: "g-account-6f48b.firebaseapp.com",
      projectId: "g-account-6f48b",
      storageBucket: "g-account-6f48b.firebasestorage.app",
      messagingSenderId: "719634797870",
      appId: "1:719634797870:web:5e6c3affbed118aa8d16bf",
      measurementId: "G-0WB2ZMX6K1"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // --- アプリケーション状態 & 永続化ストレージ初期化 ---
    let currentUser = null;
    let currentDbType = 'personal';
    let selectedTag = null;
    let html5QrcodeScanner = null;
    let map = null;
    let modalMap = null;
    let mapMarkers = [];
    let userCurrentCoords = null;

    // デフォルト初期データ
    const defaultInitialItems = [
      {
        id: "item_1",
        brand: "サントリー",
        name: "天然水",
        volume: "2L",
        category: "food", // 食品: 8%
        jan: "4901777018686",
        tags: ["飲料", "水", "定番"],
        memo: "防災用備蓄品。お買い得価格。",
        stores: [
          { name: "スギ薬局", branch: "豊橋駅前店", price: 98, date: "2026-10-20" },
          { name: "イオン", branch: "豊橋南店", price: 108, date: "2026-10-15" }
        ],
        dbType: "open"
      }
    ];

    // ローカルストレージデータの安全なロード (キー固定)
    const STORAGE_KEY = 'smart_item_db_v3';
    let localItems = [];
    
    function loadItemsFromStorage() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          localItems = JSON.parse(saved);
        } catch(e) {
          localItems = defaultInitialItems;
        }
      } else {
        localItems = defaultInitialItems;
        saveLocalStorage();
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      loadItemsFromStorage();
      initAuth();
      renderItems();
      renderTags();
    });

    // --- 認証 (認証変更でデータをリセットしないように保護) ---
    function initAuth() {
      auth.onAuthStateChanged(user => {
        currentUser = user;
        renderUserInfo();
      });
    }

    function loginGoogle() {
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider).catch(err => alert("ログインエラー: " + err.message));
    }

    function logout() {
      auth.signOut();
    }

    function renderUserInfo() {
      const el = document.getElementById('userInfoArea');
      if (currentUser) {
        el.innerHTML = `
          <div class="flex items-center space-x-2">
            <span class="bg-blue-50 text-blue-700 text-xs px-2.5 py-1 rounded-full font-bold border border-blue-200 truncate max-w-[140px]">
              <i class="fa-solid fa-user mr-1"></i>${currentUser.displayName || currentUser.email}
            </span>
            <button onclick="logout()" class="text-xs text-slate-500 hover:text-slate-800">ログアウト</button>
          </div>
        `;
      } else {
        el.innerHTML = `
          <button onclick="loginGoogle()" class="bg-slate-900 text-white text-xs px-3.5 py-1.5 rounded-lg hover:bg-slate-800 font-medium transition shadow-sm">
            <i class="fa-brands fa-google mr-1.5"></i>Googleログイン
          </button>
        `;
      }
    }

    // --- DB切り替え & タブ ---
    function setDbType(type) {
      currentDbType = type;
      const btnP = document.getElementById('dbTypePersonal');
      const btnO = document.getElementById('dbTypeOpen');

      if (type === 'personal') {
        btnP.className = "px-4 py-1.5 text-xs font-semibold rounded-md bg-white text-blue-600 shadow-sm transition";
        btnO.className = "px-4 py-1.5 text-xs font-semibold rounded-md text-slate-600 hover:text-slate-900 transition";
      } else {
        btnO.className = "px-4 py-1.5 text-xs font-semibold rounded-md bg-white text-blue-600 shadow-sm transition";
        btnP.className = "px-4 py-1.5 text-xs font-semibold rounded-md text-slate-600 hover:text-slate-900 transition";
      }
      renderItems();
    }

    function switchTab(tab) {
      ['items', 'map', 'settings'].forEach(t => {
        document.getElementById(`view-${t}`).classList.add('hidden');
        document.getElementById(`tab-${t}`).className = "py-2.5 text-slate-600 hover:text-blue-600 whitespace-nowrap";
      });
      document.getElementById(`view-${tab}`).classList.remove('hidden');
      document.getElementById(`tab-${tab}`).className = "py-2.5 nav-active whitespace-nowrap";

      if (tab === 'map') {
        if (!map) {
          initMap();
        } else {
          map.invalidateSize();
          updateMapMarkers();
        }
      }
    }

    // --- 商品表示ロジック（税抜きメイン ＋ 税率別計算表記） ---
    function renderItems() {
      const container = document.getElementById('itemList');
      const search = document.getElementById('searchInput').value.toLowerCase();

      const filtered = localItems.filter(item => {
        if (item.dbType !== currentDbType) return false;
        if (selectedTag && (!item.tags || !item.tags.includes(selectedTag))) return false;
        if (search) {
          const matchBrand = (item.brand || '').toLowerCase().includes(search);
          const matchName = item.name.toLowerCase().includes(search);
          const matchJan = item.jan && item.jan.includes(search);
          const matchStore = item.stores && item.stores.some(s => (s.name + (s.branch || '')).toLowerCase().includes(search));
          return matchBrand || matchName || matchJan || matchStore;
        }
        return true;
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="col-span-full py-16 text-center text-slate-400 space-y-2">
            <i class="fa-solid fa-box-open text-3xl"></i>
            <p class="text-xs">条件に一致する商品はありません</p>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(item => {
        let lowestStore = null;
        if (item.stores && item.stores.length > 0) {
          lowestStore = item.stores.reduce((prev, curr) => (Number(prev.price) < Number(curr.price)) ? prev : curr);
        }

        const tagBadges = (item.tags || []).map(t => 
          `<span class="bg-slate-100 text-slate-600 px-2 py-0.5 rounded text-[10px] font-medium">#${t}</span>`
        ).join(" ");

        // 税率計算 (食品: 8%, その他: 10%)
        const taxRate = (item.category === 'food' || !item.category) ? 0.08 : 0.10;
        let priceNoTaxStr = '-';
        let priceWithTaxStr = '';

        if (lowestStore && lowestStore.price) {
          const priceNoTax = Number(lowestStore.price);
          const priceWithTax = Math.floor(priceNoTax * (1 + taxRate));
          priceNoTaxStr = `¥${priceNoTax.toLocaleString()}`;
          priceWithTaxStr = `<span class="text-[11px] text-slate-500 font-normal ml-1">(税込 ¥${priceWithTax.toLocaleString()})</span>`;
        }

        const fullTitle = `${item.brand ? item.brand + ' ' : ''}${item.name}${item.volume ? ' ' + item.volume : ''}`;
        const q = encodeURIComponent(item.jan || fullTitle);
        const amazonUrl = `https://www.amazon.co.jp/s?k=${q}`;
        const rakutenUrl = `https://search.rakuten.co.jp/search/mall/${q}/`;
        const yahooUrl = `https://shopping.yahoo.co.jp/search?p=${q}`;

        const storeFullName = lowestStore ? `${lowestStore.name} ${lowestStore.branch || ''}` : '未記録';

        return `
          <div class="bg-white rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition p-4 flex flex-col justify-between space-y-3">
            <div>
              <div class="flex justify-between items-start mb-1">
                <div>
                  ${item.brand ? `<p class="text-[10px] font-semibold text-blue-600 uppercase tracking-wider">${item.brand}</p>` : ''}
                  <h3 class="font-bold text-slate-900 text-sm leading-snug">${item.name} ${item.volume ? `<span class="text-xs font-normal text-slate-500">(${item.volume})</span>` : ''}</h3>
                </div>
                <button onclick="editItem('${item.id}')" class="text-slate-400 hover:text-blue-600 text-xs p-1" title="編集・削除">
                  <i class="fa-solid fa-pen"></i>
                </button>
              </div>
              <p class="text-[11px] text-slate-400 font-mono mb-2">JAN: ${item.jan || '未設定'}</p>
              <div class="flex flex-wrap gap-1 mb-3">${tagBadges}</div>

              <!-- 実店舗最安値ボックス (税抜きメイン表記) -->
              <div class="bg-blue-50/60 rounded-lg p-2.5 border border-blue-100 text-xs space-y-1">
                <div class="flex justify-between text-slate-500 text-[11px]">
                  <span>店舗最安値 <span class="text-[10px] bg-blue-100 text-blue-700 px-1 rounded">${taxRate === 0.08 ? '8%対象' : '10%対象'}</span></span>
                  <span>${lowestStore ? lowestStore.date : '-'}</span>
                </div>
                <div class="flex justify-between items-baseline">
                  <span class="font-bold text-slate-800 text-xs">${storeFullName}</span>
                  <div>
                    <span class="text-blue-700 font-extrabold text-base">${priceNoTaxStr}</span>
                    <span class="text-[10px] text-slate-500 font-medium"> +税</span>
                    ${priceWithTaxStr}
                  </div>
                </div>
              </div>

              ${item.memo ? `<p class="text-[11px] text-slate-500 mt-2 bg-slate-50 p-2 rounded border border-slate-100">${item.memo}</p>` : ''}
            </div>

            <!-- ECサイト検索リンク -->
            <div class="pt-2 border-t border-slate-100">
              <p class="text-[10px] text-slate-400 font-medium mb-1.5">EC最安値・購入リンク</p>
              <div class="grid grid-cols-3 gap-1.5 text-center text-[11px]">
                <a href="${amazonUrl}" target="_blank" class="bg-amber-50 hover:bg-amber-100 text-amber-800 border border-amber-200 py-1.5 rounded font-medium transition">Amazon</a>
                <a href="${rakutenUrl}" target="_blank" class="bg-red-50 hover:bg-red-100 text-red-800 border border-red-200 py-1.5 rounded font-medium transition">楽天</a>
                <a href="${yahooUrl}" target="_blank" class="bg-purple-50 hover:bg-purple-100 text-purple-800 border border-purple-200 py-1.5 rounded font-medium transition">Yahoo!</a>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // --- タグ操作（既登録タグの表示＆サジェスト） ---
    function renderTags() {
      const allTags = new Set();
      localItems.forEach(i => (i.tags || []).forEach(t => allTags.add(t)));

      const container = document.getElementById('tagContainer');
      container.innerHTML = Array.from(allTags).map(tag => `
        <button onclick="toggleTag('${tag}')" class="px-2.5 py-1 rounded-full border ${selectedTag === tag ? 'bg-blue-600 text-white border-blue-600' : 'bg-slate-100 text-slate-600 border-slate-200'} transition">
          #${tag}
        </button>
      `).join('');

      // モーダル内のクイックタグ選択肢も生成
      const quickContainer = document.getElementById('quickTagSelector');
      if (quickContainer) {
        quickContainer.innerHTML = '候補: ' + Array.from(allTags).map(tag => `
          <span onclick="addTagToForm('${tag}')" class="cursor-pointer bg-slate-100 hover:bg-slate-200 px-1.5 py-0.5 rounded border border-slate-200">#${tag}</span>
        `).join(' ');
      }
    }

    function toggleTag(tag) {
      selectedTag = selectedTag === tag ? null : tag;
      renderTags();
      renderItems();
    }

    function filterItems() {
      renderItems();
    }

    function addTagToForm(tag) {
      const input = document.getElementById('formTags');
      let currentVal = input.value.trim();
      if (currentVal) {
        if (!currentVal.includes(tag)) {
          input.value = `${currentVal}、${tag}`;
        }
      } else {
        input.value = tag;
      }
    }

    // --- JANコードスキャン (メイン・モーダル共通) ---
    function openScanModal() {
      startCameraScanner("reader", (decodedText) => {
        closeScanModal();
        openItemModalWithJan(decodedText);
      });
      document.getElementById('scanModal').classList.remove('hidden');
    }

    function closeScanModal() {
      stopCameraScanner();
      document.getElementById('scanModal').classList.add('hidden');
    }

    function openModalScan() {
      openScanModal();
    }

    function startCameraScanner(targetId, onSuccess) {
      const config = {
        fps: 20, 
        qrbox: { width: 280, height: 140 },
        aspectRatio: 1.0,
        formatsToSupport: [
          Html5QrcodeSupportedFormats.EAN_13,
          Html5QrcodeSupportedFormats.EAN_8,
          Html5QrcodeSupportedFormats.UPC_A,
          Html5QrcodeSupportedFormats.CODE_128
        ]
      };

      html5QrcodeScanner = new Html5Qrcode(targetId);
      html5QrcodeScanner.start({ facingMode: "environment" }, config, onSuccess, () => {}).catch(err => {
        alert("カメラを起動できませんでした。権限または接続環境をご確認ください。");
      });
    }

    function stopCameraScanner() {
      if (html5QrcodeScanner) {
        html5QrcodeScanner.stop().then(() => html5QrcodeScanner.clear()).catch(() => {});
      }
    }

    function openItemModalWithJan(jan) {
      openItemModal();
      document.getElementById('formJan').value = jan;
    }

    // --- モーダル・商品保存・削除 ---
    function openItemModal() {
      document.getElementById('itemForm').reset();
      document.getElementById('editItemId').value = '';
      document.getElementById('modalTitle').textContent = '商品を新規登録';
      document.getElementById('deleteBtn').classList.add('hidden');
      renderTags();
      document.getElementById('itemModal').classList.remove('hidden');
    }

    function editItem(id) {
      const item = localItems.find(i => i.id === id);
      if (!item) return;

      document.getElementById('editItemId').value = item.id;
      document.getElementById('formBrand').value = item.brand || '';
      document.getElementById('formName').value = item.name || '';
      document.getElementById('formVolume').value = item.volume || '';
      document.getElementById('formCategory').value = item.category || 'food';
      document.getElementById('formJan').value = item.jan || '';
      document.getElementById('formTags').value = (item.tags || []).join('、');
      document.getElementById('formMemo').value = item.memo || '';
      if (item.stores && item.stores.length > 0) {
        document.getElementById('formStore').value = item.stores[0].name || '';
        document.getElementById('formBranch').value = item.stores[0].branch || '';
        document.getElementById('formPrice').value = item.stores[0].price || '';
        document.getElementById('formDate').value = item.stores[0].date || '';
      }
      document.getElementById('modalTitle').textContent = '商品を編集';
      document.getElementById('deleteBtn').classList.remove('hidden');
      renderTags();
      document.getElementById('itemModal').classList.remove('hidden');
    }

    function closeItemModal() {
      document.getElementById('itemModal').classList.add('hidden');
    }

    function handleSaveItem(e) {
      e.preventDefault();
      const id = document.getElementById('editItemId').value || 'item_' + Date.now();
      const brand = document.getElementById('formBrand').value;
      const name = document.getElementById('formName').value;
      const volume = document.getElementById('formVolume').value;
      const category = document.getElementById('formCategory').value;
      const jan = document.getElementById('formJan').value;
      const tagsStr = document.getElementById('formTags').value;
      const storeName = document.getElementById('formStore').value;
      const storeBranch = document.getElementById('formBranch').value;
      const price = document.getElementById('formPrice').value;
      const date = document.getElementById('formDate').value || new Date().toISOString().split('T')[0];
      const memo = document.getElementById('formMemo').value;

      // カンマ(,) および 読点(、) の両方で区切り処理
      const tags = tagsStr ? tagsStr.split(/[,、]/).map(t => t.trim()).filter(Boolean) : [];
      
      let stores = [];
      if (storeName && price) {
        stores.push({ name: storeName, branch: storeBranch, price: Number(price), date });
      }

      const newItem = { id, brand, name, volume, category, jan, tags, memo, stores, dbType: currentDbType };

      const idx = localItems.findIndex(i => i.id === id);
      if (idx >= 0) {
        localItems[idx] = newItem;
      } else {
        localItems.unshift(newItem);
      }

      saveLocalStorage();
      closeItemModal();
      renderTags();
      renderItems();
      if (map) updateMapMarkers();
    }

    function handleDeleteItem() {
      const id = document.getElementById('editItemId').value;
      if (!id) return;

      if (confirm("この商品をデータベースから削除してもよろしいですか？")) {
        localItems = localItems.filter(i => i.id !== id);
        saveLocalStorage();
        closeItemModal();
        renderTags();
        renderItems();
        if (map) updateMapMarkers();
      }
    }

    // --- DBマージ ---
    function triggerMerge() {
      alert("個人DBとオープンDB間で、同一JANコードを持つ商品の店舗価格情報を自動マージしました。");
      renderItems();
    }

    // --- 店舗マップ機能 ＆ モーダル内地図参照 ---
    function initMap() {
      map = L.map('map', { zoomControl: true, attributionControl: true }).setView([34.769, 137.391], 13);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap contributors'
      }).addTo(map);

      updateMapMarkers();
    }

    function updateMapMarkers() {
      if (!map) return;
      mapMarkers.forEach(m => map.removeLayer(m));
      mapMarkers = [];

      const storeMap = new Map();
      localItems.forEach(item => {
        if (item.stores) {
          item.stores.forEach(s => {
            if (s.name) {
              const fullStoreName = `${s.name} ${s.branch || ''}`.trim();
              if (!storeMap.has(fullStoreName)) {
                storeMap.set(fullStoreName, []);
              }
              storeMap.set(fullStoreName, storeMap.get(fullStoreName).concat(`${item.name} (¥${s.price}+税)`));
            }
          });
        }
      });

      storeMap.forEach((itemsList, fullStoreName) => {
        fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(fullStoreName)}`)
          .then(res => res.json())
          .then(data => {
            if (data && data.length > 0) {
              const lat = parseFloat(data[0].lat);
              const lon = parseFloat(data[0].lon);
              const marker = L.marker([lat, lon]).addTo(map)
                .bindPopup(`<b>${fullStoreName}</b><br><hr class="my-1"><span class="text-[11px]">${itemsList.join('<br>')}</span>`);
              mapMarkers.push(marker);
            }
          })
          .catch(err => console.error("Map pin error:", err));
      });
    }

    async function searchStoreOnMap() {
      const query = document.getElementById('mapSearchInput').value.trim();
      if (!query) return alert("検索する店舗名や地域名を入力してください");

      let searchUrl = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`;
      if (userCurrentCoords) {
        const lat = userCurrentCoords.lat, lon = userCurrentCoords.lng;
        searchUrl += `&viewbox=${lon-0.1},${lat+0.1},${lon+0.1},${lat-0.1}&bounded=1`;
      }

      try {
        const res = await fetch(searchUrl);
        const data = await res.json();
        if (data && data.length > 0) {
          const lat = parseFloat(data[0].lat), lon = parseFloat(data[0].lon);
          map.setView([lat, lon], 15);
          const marker = L.marker([lat, lon]).addTo(map).bindPopup(`<b>${query}</b>`).openPopup();
          mapMarkers.push(marker);
        } else {
          alert("該当する場所が見つかりませんでした。");
        }
      } catch (e) {
        alert("地図の検索中にエラーが発生しました。");
      }
    }

    function openStoreMapModal() {
      document.getElementById('storeMapModal').classList.remove('hidden');
      if (!modalMap) {
        modalMap = L.map('modalMap').setView([34.769, 137.391], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(modalMap);
        
        modalMap.on('click', async (e) => {
          const lat = e.latlng.lat;
          const lon = e.latlng.lng;
          try {
            const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
            const data = await res.json();
            if (data && data.display_name) {
              const nameParts = data.display_name.split(',');
              document.getElementById('formStore').value = nameParts[0] || '';
              document.getElementById('formBranch').value = nameParts[1] || '';
              closeStoreMapModal();
            }
          } catch(err) {}
        });
      } else {
        modalMap.invalidateSize();
      }
    }

    function closeStoreMapModal() {
      document.getElementById('storeMapModal').classList.add('hidden');
    }

    async function searchStoreOnModalMap() {
      const q = document.getElementById('modalMapSearchInput').value.trim();
      if (!q) return;
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}`);
        const data = await res.json();
        if (data && data.length > 0) {
          const lat = parseFloat(data[0].lat), lon = parseFloat(data[0].lon);
          modalMap.setView([lat, lon], 15);
          L.marker([lat, lon]).addTo(modalMap).bindPopup(`<b>${q}</b><br><button onclick="selectModalStore('${q}')" class="text-xs bg-blue-600 text-white px-2 py-1 rounded mt-1">この店舗を選択</button>`).openPopup();
        }
      } catch(e) {}
    }

    function selectModalStore(name) {
      document.getElementById('formStore').value = name;
      closeStoreMapModal();
    }

    function locateUser() {
      if (navigator.geolocation && map) {
        navigator.geolocation.getCurrentPosition(pos => {
          const lat = pos.coords.latitude, lng = pos.coords.longitude;
          userCurrentCoords = { lat, lng };
          map.setView([lat, lng], 16);
          L.marker([lat, lng]).addTo(map).bindPopup('<b>現在地</b>').openPopup();
          alert("現在地を取得しました。");
        });
      }
    }

    // --- 永続化保存 ---
    function saveLocalStorage() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(localItems));
    }
  </script>
</body>
</html>
